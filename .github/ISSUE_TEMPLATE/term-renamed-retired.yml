name: Term renamed or retired
description: A product, feature or term changed its name or was retired
labels: [rename, retirement]
body:
  - type: input
    id: old
    attributes:
      label: Old name
    validations: { required: true }
  - type: input
    id: new
    attributes:
      label: New name (or "retired")
    validations: { required: true }
  - type: input
    id: date
    attributes:
      label: Effective date
      description: Month and year, or the exact day for a retirement. Say if it is not stated.
  - type: textarea
    id: evidence
    attributes:
      label: How do you know?
      description: Name the announcement in plain text.
